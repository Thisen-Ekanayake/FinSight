# ═══════════════════════════════════════════════
# FinSight — Local stack
# ═══════════════════════════════════════════════
#
# ⚠️  ISOLATION NOTICE
# This machine already runs a Qdrant on :6333/:6334 belonging to another
# project (compose project "docker", collections athena_content and
# image_embeddings). FinSight therefore runs its OWN instance:
#
#   • explicit project name       -> "finsight" (theirs is "docker")
#   • pinned image tag            -> v1.17.1    (theirs is :latest)
#   • different host ports        -> 6335/6336  (theirs is 6333/6334)
#   • separate named volume       -> finsight-qdrant
#
# src/vectorstore/client.py additionally refuses to connect if it sees the
# other project's collections, which catches a stale QDRANT_URL in .env.
# ───────────────────────────────────────────────

name: finsight

services:
  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: finsight-qdrant
    ports:
      - "6335:6333"   # HTTP
      - "6336:6334"   # gRPC
    volumes:
      - finsight-qdrant:/qdrant/storage
    environment:
      QDRANT__LOG_LEVEL: INFO
    restart: unless-stopped
    healthcheck:
      # Qdrant's image is distroless-ish; use its own binary rather than curl.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: .
    container_name: finsight-api
    ports: ["8000:8000"]
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333    # in-network: the container port, not the host's 6335
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - finsight-data:/app/data
      # Vertex auth. The image runs as uid 1000 "finsight", so HOME inside the
      # container is /home/finsight and google-auth looks for ADC there — never
      # in the host user's ~/.config/gcloud. Mount the one file it needs.
      # Read-only is safe: google-auth refreshes the access token in memory and
      # only gcloud itself ever rewrites this file.
      #
      # create_host_path: false is deliberate. Under Docker's default, a missing
      # source would be "helpfully" created on the HOST as an empty directory,
      # which permanently breaks `gcloud auth application-default login`. Better
      # to refuse to start. On GEMINI_BACKEND=aistudio, delete this mount —
      # that path authenticates with GOOGLE_API_KEY and needs no ADC.
      #
      # Servers have no interactive gcloud login: set GOOGLE_CREDENTIALS_FILE to
      # a service-account key path instead (docs/deploy.md §2). The target stays
      # the ADC well-known path either way — google-auth loads both the
      # "authorized_user" and "service_account" JSON shapes from it.
      - type: bind
        source: ${GOOGLE_CREDENTIALS_FILE:-${HOME}/.config/gcloud/application_default_credentials.json}
        target: /home/finsight/.config/gcloud/application_default_credentials.json
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # The dashboard is a separate container on purpose, not a second process in
  # the api one — it is the thing that would move to a different host or a
  # different origin first, and src/api/main.py's wide-open CORS already
  # assumes exactly that split.
  #
  # It is a static bundle behind nginx, which also proxies /api to the service
  # below. The browser therefore only ever sees one origin: "api" is a compose
  # network name and would not resolve from anyone's laptop.
  web:
    build: ./frontend
    container_name: finsight-web
    ports: ["3000:8080"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # The Streamlit dashboard this replaced. Kept because it is the reference
  # implementation of every call the UI makes and still exercises the same API
  # — but it does not start by default. Bring it up deliberately:
  #
  #   docker compose --profile legacy up -d ui
  ui:
    build: .
    container_name: finsight-ui
    profiles: ["legacy"]
    command: ["streamlit", "run", "src/ui/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    ports: ["8501:8501"]
    env_file: .env
    environment:
      API_URL: http://api:8000          # in-network: the container port, not the host's 8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  finsight-qdrant:
  finsight-data:

networks:
  default:
    name: finsight-net
