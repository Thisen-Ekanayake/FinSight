# ═══════════════════════════════════════════════════════
# FinSight web — nginx
# ═══════════════════════════════════════════════════════
#
# Serves the built SPA and proxies /api to the api service, so the browser
# only ever talks to one origin. The alternative — pointing the bundle at
# http://api:8000 — cannot work: "api" is a name on the compose network that
# resolves inside the container, not in the visitor's browser.
# ═══════════════════════════════════════════════════════

server {
    listen       8080;
    server_name  _;

    root       /usr/share/nginx/html;
    index      index.html;

    # Fingerprinted filenames, so the asset directory can be cached hard while
    # index.html itself must never be — a stale index points at assets that a
    # redeploy has already deleted.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ══ SSE: BUFFERING OFF, TIMEOUT LONGER THAN A RESEARCH RUN ══
    #   POST /research/query/stream holds a connection open for 30–60 seconds
    #   and delivers node frames throughout. With proxy_buffering on (the
    #   default) nginx would hold those frames and release them in one burst
    #   at the end, which turns real progress back into a spinner. The read
    #   timeout has to outlast the slowest run for the same reason — the
    #   backend's own long timeout is 120s, so this sits above it.
    location /api/ {
        proxy_pass              http://api:8000/;
        proxy_http_version      1.1;
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        Connection "";

        proxy_buffering         off;
        proxy_cache             off;
        proxy_read_timeout      300s;
        proxy_send_timeout      300s;
        chunked_transfer_encoding on;
    }

    # ══ LOAD-BEARING: THE SPA FALLBACK IS WHAT MAKES /findings A URL ══
    #   The app routes on real paths (src/hooks/useRoute.ts), so a hard refresh
    #   or a shared link asks nginx for /findings — a file that does not exist
    #   in the build. Serving index.html for it hands the request to the router
    #   instead. Drop this line and in-app navigation still works while every
    #   deep link 404s, which is the kind of break that only shows up in
    #   production. It also catches stray paths (an old bookmark, a probe).
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip             on;
    gzip_types       text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length  1024;
}
